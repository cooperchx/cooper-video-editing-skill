<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cooper · 完整包装动效库</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><aside class="sidebar"><div class="brand">Cooper<i> / Motion</i></div><p class="small">PACKAGING LIBRARY · VOL. 02</p><input id="search" class="search" type="search" placeholder="搜索卡片、蒙版、鱼眼…" aria-label="搜索包装"><nav class="nav" id="nav" aria-label="包装场景"></nav></aside><main class="main"><header class="topline"><div><h1 id="heading">完整包装动效库</h1><p>同一套构图与动效，两种完整配色。</p></div><div class="top-actions"><div class="palette-switch" role="group" aria-label="整套包装配色"><button type="button" data-palette-choice="blue" aria-pressed="true"><i class="swatch swatch-blue"></i>蓝白</button><button type="button" data-palette-choice="teal" aria-pressed="false"><i class="swatch swatch-teal"></i>黑＋正绿</button></div><span class="badge" id="count">30 个场景 · 16:9</span></div></header><div class="font-tools"><a href="guide.html">完整剪辑规范与 GIF 图鉴</a> · <a href="https://github.com/cooperchx/cooper-video-editing-skill">GitHub / Skill</a><br><span id="font-status">公开演示字体：Noto Serif SC（开源替代，非原研宋）</span> · <label>加载获授权的本地字体 <input id="local-font" type="file" accept=".ttf,.otf,.woff,.woff2"></label></div><div class="viewer" id="viewer"><div class="stage" id="stage"><svg width="0" height="0" style="position:absolute"><defs><clipPath id="personClip" clipPathUnits="objectBoundingBox"><path transform="scale(0.000625 0.001111111111)" d="M380 900 C390 730 460 615 652 590 L690 533 C650 484 635 413 638 329 C640 194 703 126 790 126 C883 126 941 197 942 329 C945 416 928 486 885 534 L930 590 C1110 615 1188 733 1200 900Z"/></clipPath></defs></svg><div id="scene-root"></div><div class="safe-guide" id="safe"></div></div></div><div class="controls"><button class="btn primary icon" id="play" aria-label="暂停">暂停</button><button class="btn icon" id="restart" aria-label="重播">↺</button><span class="time" id="time">0.00 / 6.00</span><input id="scrub" class="scrub" type="range" min="0" max="6" value="0" step="0.01" aria-label="播放时间"><select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select><label class="autolabel" style="font-size:11px;white-space:nowrap"><input type="checkbox" id="autonext"> 连播</label><button class="btn" id="prev" aria-label="上一个场景">←</button><button class="btn" id="next" aria-label="下一个场景">→</button><button class="btn" id="fullscreen">全屏</button></div><div class="detail"><section><div class="small" id="scene-id" style="margin-bottom:8px"></div><h2 id="title"></h2><p class="description" id="description"></p><div class="tags" id="tags"></div><p class="description" id="asset-note"></p><div id="media-upload" class="upload" hidden><label>替换鱼眼素材 <input id="file" type="file" accept="image/*,video/*"></label><button class="btn" id="reset-media">还原示例</button></div></section><section class="editors"><label class="wide">主文字<input id="copy-title" type="text" maxlength="36"></label><label class="wide">说明文字<input id="copy-sub" type="text" maxlength="50"></label><label>强调色<input id="accent" type="color" value="#294acb"></label><label>文字比例 <span id="size-value">100%</span><input id="text-scale" type="range" min="75" max="115" value="100"></label><label>玻璃雾度<input id="frost" type="range" min="25" max="80" value="58"></label><label>鱼眼强度<input id="lens" type="range" min="0" max="45" value="18"></label><label class="wide" style="display:block"><input id="show-safe" type="checkbox"> 显示文字安全区</label><button class="btn wide" id="reset">还原当前场景</button></section></div><p class="bottom-note">所有包装均为浏览器代码实时绘制，可暂停、拖动和替换文案。人像、界面和纹理均为原创代码占位图，不含私人媒体；人物轮廓来自同一匿名绘图。音轨未加入。HTML 材质与动画已实现，接入视频时间线时仍需做逐帧人像蒙版与渲染器适配。</p></main></div><script>const ASSETS={"person": "assets/media/person.png", "screen": "assets/media/screen.png", "wool": "assets/media/wool.png", "oil": "assets/media/oil.png"};</script><script src="app.js"></script></body></html>
